<style>
#lax-preview .lx{--lx-bg:light-dark(#f7f9fc,#111a22);--lx-panel:light-dark(#ffffff,#1a2631);--lx-text:light-dark(#182734,#e5eff5);--lx-muted:light-dark(#5f7180,#a4b7c6);--lx-line:light-dark(#e1e8ee,#344554);--lx-soft:light-dark(#edf4f8,#233846);--lx-brand:#087f8c;--lx-on:#ffffff;background:var(--lx-bg);color:var(--lx-text);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:600px;border-radius:18px;overflow:hidden}
#lax-preview .lx *{box-sizing:border-box}
#lax-preview [hidden]{display:none!important}
#lax-preview .lx header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:23px 30px;border-bottom:1px solid var(--lx-line)}
#lax-preview .lx .logo{font-size:23px;font-weight:700;letter-spacing:-1px;color:var(--lx-brand)}
#lax-preview .lx .quiet{color:var(--lx-muted)}
#lax-preview .lx .pill{display:inline-block;padding:4px 10px;background:var(--lx-soft);border-radius:20px;font-size:12px;color:var(--lx-muted)}
#lax-preview .lx button{font:inherit;border:1px solid var(--lx-line);border-radius:10px;padding:10px 16px;background:var(--lx-panel);color:var(--lx-text)}
#lax-preview .lx button.main{background:var(--lx-brand);border-color:var(--lx-brand);color:var(--lx-on);font-weight:600}
#lax-preview .lx button.link{border:0;background:transparent;color:var(--lx-muted);padding:5px}
#lax-preview .lx button[aria-pressed=true]{border-color:var(--lx-brand);background:var(--lx-soft)}
#lax-preview .lx .hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:42px 32px 28px;align-items:center}
#lax-preview .lx h1{font-size:35px;line-height:1.25;letter-spacing:-1px;margin:16px 0;font-weight:650}
#lax-preview .lx h2{font-size:19px;margin:0 0 15px;font-weight:600}
#lax-preview .lx p{margin:10px 0 18px}
#lax-preview .lx .choices{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 12px}
#lax-preview .lx .choices button{padding:8px 10px}
#lax-preview .lx .composer{background:var(--lx-panel);border:1px solid var(--lx-line);border-radius:16px;padding:15px}
#lax-preview .lx textarea{width:100%;resize:vertical;min-height:85px;border:0;background:transparent;color:var(--lx-text);font:inherit;outline-offset:3px}
#lax-preview .lx .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#lax-preview .lx .demo{background:var(--lx-panel);border:1px solid var(--lx-line);border-radius:17px;box-shadow:0 15px 35px light-dark(#203b4910,#00000025);padding:22px}
#lax-preview .lx .prompt{background:var(--lx-soft);padding:12px 15px;border-radius:12px;margin:15px 0}
#lax-preview .lx .status{color:var(--lx-brand);font-size:13px;margin:16px 0}
#lax-preview .lx .file{border:1px solid var(--lx-line);border-radius:12px;padding:16px;margin-top:12px}
#lax-preview .lx .bars{display:grid;gap:10px;margin:20px 0}
#lax-preview .lx .bar{display:grid;grid-template-columns:38px 1fr 35px;gap:8px;align-items:center;font-size:12px}
#lax-preview .lx .track{height:10px;background:var(--lx-soft);border-radius:3px;overflow:hidden}
#lax-preview .lx .track span{height:100%;display:block;background:var(--lx-brand);border-radius:3px}
#lax-preview .lx .steps{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;padding:20px 24px;border-top:1px solid var(--lx-line);color:var(--lx-muted);font-size:13px}
#lax-preview .lx .center{max-width:720px;margin:auto;padding:35px 28px}
#lax-preview .lx .taskgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
#lax-preview .lx .taskgrid button{text-align:left;padding:18px;min-height:115px}
#lax-preview .lx .taskgrid strong{display:block;margin:10px 0 5px;font-weight:600}
#lax-preview .lx .small{font-size:12px}
#lax-preview .lx .notice{margin-top:12px;min-height:22px;color:var(--lx-brand);font-size:13px}
#lax-preview .lx .intro{text-align:center}
@media(max-width:640px){#lax-preview .lx{min-height:850px}#lax-preview .lx header{padding:18px}#lax-preview .lx .hero{grid-template-columns:1fr;padding:24px 18px;gap:22px}#lax-preview .lx h1{font-size:29px}#lax-preview .lx .taskgrid{grid-template-columns:1fr;gap:8px}#lax-preview .lx .taskgrid button{min-height:auto;padding:12px}#lax-preview .lx .taskgrid strong{margin:0 0 3px}#lax-preview .lx .center{padding:24px 18px}}

#lax-preview{max-width:1160px;margin:0 auto}
#lax-preview .lx button{cursor:pointer}
#lax-preview .lx button:focus-visible{outline:3px solid var(--lx-brand);outline-offset:3px}
#lax-preview .lx textarea{font-size:16px}
</style>
<div id="lax-preview">
<div class="lx" id="lx-guide" aria-label="渐进式引导页">
<header><span class="logo">LaxCode</span><span class="quiet small">快速上手 · 概念示意</span></header>
<div class="center"><div class="intro"><span class="pill" data-guide="step">1 / 3 · 选择一个小任务</span><h1 data-guide="heading">先完成一件小事。</h1><p class="quiet" data-guide="description">选一个示例，体验从想法到文件的完整过程。</p></div>
<div class="taskgrid"><button type="button" data-pick="分析销售数据" aria-pressed="true"><strong>分析销售数据</strong><span class="quiet small">得到 CSV 和可视化报告</span></button><button type="button" data-pick="生成小工具" aria-pressed="false"><strong>生成小工具</strong><span class="quiet small">得到代码和运行说明</span></button><button type="button" data-pick="绘制流程图" aria-pressed="false"><strong>绘制流程图</strong><span class="quiet small">得到图片和可编辑源文件</span></button></div>
<div class="demo"><h2 data-guide="title">分析销售数据</h2><p class="quiet" data-guide="body">自动填入一组示例数据，让 Agent 实际计算并生成文件。</p><div class="row"><span class="pill" data-guide="tag">不需要准备素材</span><button type="button" class="main" data-guide="next">查看执行过程 →</button></div></div><div class="notice" aria-live="polite" data-guide="feedback"></div>
</div><div class="steps"><span>选择任务</span><span>查看执行</span><span>获取成果</span></div>
</div>
</div>
<script>
(()=>{
const root=document.getElementById('lax-preview');
const b=root.querySelector('#lx-guide');
let state={choice:'report',step:0,pick:'分析销售数据'};
function renderB(){const i=Math.min(2,Math.max(0,state.step));const headings=['先完成一件小事。','每一步，都看得见。','成果就在这里。'];const desc=['选一个示例，体验从想法到文件的完整过程。','任务在你的独立云端工作区中执行。','先预览，再下载；也可以继续提出修改。'];b.querySelector('[data-guide="step"]').textContent=(i+1)+' / 3 · '+['选择一个小任务','查看执行过程','获取成果'][i];b.querySelector('[data-guide="heading"]').textContent=headings[i];b.querySelector('[data-guide="description"]').textContent=desc[i];b.querySelector('.taskgrid').hidden=i!==0;b.querySelector('[data-guide="title"]').textContent=i===0?state.pick:['','执行进度','任务成果'][i];b.querySelector('[data-guide="body"]').textContent=['自动填入示例任务，让 Agent 实际执行并生成文件。','✓ 准备工作区　→　✓ 执行任务　→　✓ 验证结果','将生成的文件直接展示在回答下方，提供预览、单文件下载和打包下载。'][i];b.querySelector('[data-guide="tag"]').textContent=['不需要准备素材','工具明细按需展开','无需寻找文件路径'][i];b.querySelector('[data-guide="next"]').textContent=['查看执行过程 →','查看成果 →','重新体验示例 ↺'][i];b.querySelectorAll('[data-pick]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.pick===state.pick)));}
b.querySelectorAll('[data-pick]').forEach(e=>e.addEventListener('click',()=>{state.pick=e.dataset.pick;renderB();}));
b.querySelector('[data-guide="next"]').addEventListener('click',()=>{state.step=(state.step+1)%3;renderB();b.querySelector('[data-guide="feedback"]').textContent='当前为引导交互示意，不会执行线上任务。';});
renderB();
})();
</script>
